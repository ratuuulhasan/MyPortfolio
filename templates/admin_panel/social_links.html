{% extends 'admin_panel/base_admin.html' %}
{% block page_title %}Social Links{% endblock %}
{% block content %}
<a href="{% url 'admin_social_add' %}" class="btn btn-gradient mb-3"><i class="bi bi-plus"></i> Add Link</a>
<div class="card">
    <table class="table table-hover mb-0">
        <thead class="table-light">
            <tr><th>Platform</th><th>URL</th><th>Icon</th><th style="width:150px;">Actions</th></tr>
        </thead>
        <tbody>
            {% for l in links %}
            <tr>
                <td>{{ l.platform }}</td>
                <td><a href="{{ l.url }}" target="_blank">{{ l.url|truncatechars:40 }}</a></td>
                <td><i class="{{ l.icon }}"></i></td>
                <td>
                    <a href="{% url 'admin_social_edit' l.pk %}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <a href="{% url 'admin_social_delete' l.pk %}" class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Delete?')">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="4" class="text-center text-muted py-4">No social links yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
