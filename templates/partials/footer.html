<footer class="footer">
    <div class="container text-center">
        <h4 class="mb-3" style="background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700;">
            {{ profile_global.name|default:"Portfolio" }}
        </h4>
        <p class="text-muted mb-4">{{ profile_global.title|default:"Full Stack Developer" }}</p>
        <div class="footer-social mb-4">
            {% for link in social_links_global %}
                <a href="{{ link.url }}" target="_blank" title="{{ link.platform }}">
                    <i class="{{ link.icon }}"></i>
                </a>
            {% endfor %}
        </div>
        <hr style="border-color:var(--border);">
        <p class="text-muted small mb-0">
            &copy; {% now "Y" %} {{ profile_global.name|default:"Portfolio" }}. Built with ❤️
        </p>
    </div>
</footer>
