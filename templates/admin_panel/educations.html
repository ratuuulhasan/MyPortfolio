{% extends 'admin_panel/base_admin.html' %}
{% block page_title %}Education{% endblock %}
{% block content %}
<a href="{% url 'admin_education_add' %}" class="btn btn-gradient mb-3"><i class="bi bi-plus"></i> Add Education</a>
<div class="card">
    <table class="table table-hover mb-0">
        <thead class="table-light">
            <tr><th>Degree</th><th>Institute</th><th>Year</th><th style="width:150px;">Actions</th></tr>
        </thead>
        <tbody>
            {% for e in educations %}
            <tr>
                <td>{{ e.degree }}</td>
                <td>{{ e.institute }}</td>
                <td>{{ e.year }}</td>
                <td>
                    <a href="{% url 'admin_education_edit' e.pk %}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <a href="{% url 'admin_education_delete' e.pk %}" class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Delete?')">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="4" class="text-center text-muted py-4">No education entries.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
